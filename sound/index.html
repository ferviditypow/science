<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>聲音：回聲與測距</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&display=swap">
<link rel="stylesheet" href="../shared/ui.css">
<style>
:root{--snd:#1c68ad;--echo:#d9480f;--cliff:#8b6b4a;--sea:#cfe6f5;--sky:#eef5fb;--w1:#1c68ad;--w2:#1f8a5b;--sum:#16202a}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--snd:#5ba8ec;--echo:#ff8a57;--cliff:#7a5c3e;--sea:#16324a;--sky:#141c26;--w1:#5ba8ec;--w2:#4cc28e;--sum:#e4e9ee;color-scheme:dark}}
:root[data-theme="dark"]{--snd:#5ba8ec;--echo:#ff8a57;--cliff:#7a5c3e;--sea:#16324a;--sky:#141c26;--w1:#5ba8ec;--w2:#4cc28e;--sum:#e4e9ee;color-scheme:dark}
.wrap{max-width:1280px}
.benchbar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:8px 10px}
.benchbar .seg button{font-weight:700;min-height:44px;padding:0 14px}
.benchbar .seg button .n{font-family:var(--f-mono);margin-right:5px;opacity:.65}
.bench{display:flex;flex-direction:column;gap:12px}
.grid2{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:12px;align-items:start}
@media (max-width:860px){.grid2{grid-template-columns:minmax(0,1fr)}}
.box{padding:10px 14px 14px}
.box h3{margin:0 0 6px;font-size:1rem}
.box p{margin:0 0 6px;font-size:.95rem}
.box ul{margin:4px 0 0;padding-left:1.2em;font-size:.95rem}
.box li{margin:2px 0}
.big{font-family:var(--f-display);font-weight:900;font-size:1.45rem;line-height:1.3;margin:0 0 6px}
.big .mono{font-family:var(--f-mono);font-weight:600}
.checks{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:7px;font-size:.95rem}
.checks li{display:grid;grid-template-columns:24px minmax(0,1fr);gap:8px;align-items:start}
.checks li::before{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;color:#fff;margin-top:1px}
.checks li.ok::before{content:'✓';background:var(--green)}
.checks li.no::before{content:'✕';background:#c0453b}
.checks li.info::before{content:'i';background:var(--blue)}
.formula2{font-family:var(--f-mono);font-size:.95rem;background:var(--accent-soft);border-radius:8px;padding:8px 10px;margin:6px 0;line-height:1.7}
.qgrp{margin-bottom:12px}
.qgrp h4{margin:0 0 6px;font-size:.82rem;color:var(--muted);font-weight:500;letter-spacing:.06em}
.qchips{display:flex;flex-wrap:wrap;gap:7px}
.qchip{border:1px solid var(--line);background:var(--panel);border-radius:999px;min-height:36px;padding:3px 13px;cursor:pointer;font-size:.88rem;text-align:left;color:var(--ink)}
.qchip:hover{border-color:var(--accent)}
.qchip .pg{color:var(--muted);font-size:.76rem;margin-left:4px}
.story p{white-space:pre-line}
.pick{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.gcap{font-size:.8rem;color:var(--muted);margin:6px 0 2px}
.soon{font-size:.82rem;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="eyebrow"><a href="../">自然科模擬動畫</a> · 國二 · 第三章 波動與聲音 · <a href="../doppler/">相關：都卜勒效應</a></div>
      <h1>聲音的反射：回聲與測距</h1>
    </div>
    <p>聲音碰到障礙物會反射回來，就是回聲。對牆喊、兩峭壁、船駛向山壁、測井深與海深、聲納畫海底地形、反射定律，全部可以拖曳、調整、慢動作播放；最下方有講義與考古題的情境。</p>
  </header>

  <nav class="panel benchbar" aria-label="實驗台">
    <span class="tlabel">實驗台</span>
    <span class="seg" id="benchSeg">
      <button data-v="echo" aria-pressed="true"><span class="n">5</span>回聲與測距</button>
    </span>
    <span class="soon">其他實驗台（聲音的產生與傳播、聲速、示波器與三要素、樂器、可聽範圍）製作中</span>
  </nav>

  <section class="panel story" id="story" hidden>
    <button class="x" id="storyX" aria-label="關閉說明">×</button>
    <h3 id="storyT"></h3>
    <p id="storyP"></p>
    <button class="btn" id="storyBack" style="margin-top:8px">↓ 回到題目列表</button>
  </section>

  <!-- ============ 回聲與測距 ============ -->
  <section class="bench" id="b-echo">
    <div class="panel">
      <div class="toolbar">
        <span class="tlabel">情境</span>
        <span class="seg" id="modeE">
          <button data-v="wall">對牆喊</button>
          <button data-v="cliff">兩峭壁</button>
          <button data-v="move">邊走邊鳴笛</button>
          <button data-v="depth">測井深／海深</button>
          <button data-v="map">聲納測海底</button>
          <button data-v="law">反射定律</button>
        </span>
      </div>
      <div class="toolbar">
        <button class="btn primary" id="playE">❚❚ 暫停</button>
        <button class="btn" id="rstE">⟲ 重來</button>
        <button class="btn" id="sndE" title="用真實的時間間隔播放原聲與回聲">🔊 用真實時間聽</button>
        <label class="slider" style="flex:2 1 320px"><span class="tlabel">時間</span><input type="range" id="tE" min="0" max="1000" step="1" value="0"><output id="tEo"></output></label>
        <label class="slider" style="flex:1 1 200px;min-width:180px"><span class="tlabel">慢動作</span><input type="range" id="spdE" min="1" max="5" step="1" value="3"><output id="spdEo"></output></label>
      </div>

      <!-- 聲速（對牆、兩峭壁、移動） -->
      <div class="toolbar" id="velE">
        <span class="tlabel">聲速</span>
        <span class="seg" id="medE"><button data-v="air">空氣（看氣溫）</button><button data-v="water">水 1500 m/s</button><button data-v="cus">自訂</button></span>
        <label class="slider" id="TEw"><span class="tlabel">氣溫</span><input type="range" id="TE" min="-10" max="40" step="1" value="15"><output id="TEo"></output></label>
        <label class="slider" id="vEw"><span class="tlabel">聲速</span><input type="range" id="vE" min="100" max="2000" step="1" value="340"><output id="vEo"></output></label>
      </div>

      <!-- 對牆喊 -->
      <div class="toolbar mctl" data-m="wall">
        <span class="tlabel">已知</span><span class="seg" id="givA"><button data-v="d">距離</button><button data-v="t">回聲時間</button></span>
        <label class="slider" id="dAw"><span class="tlabel">人到牆</span><input type="range" id="dA" min="1" max="400" step="0.5" value="34"><output id="dAo"></output></label>
        <label class="slider" id="tAw"><span class="tlabel">回聲時間</span><input type="range" id="tA" min="0.01" max="5" step="0.01" value="0.2"><output id="tAo"></output></label>
      </div>
      <div class="toolbar mctl" data-m="wall">
        <span class="tlabel">牆面</span><span class="seg" id="matA"><button data-v="hard">光滑堅硬（混凝土、磁磚）</button><button data-v="cloth">布幔、地毯</button><button data-v="foam">多孔吸音板、海綿</button></span>
      </div>

      <!-- 兩峭壁 -->
      <div class="toolbar mctl" data-m="cliff">
        <span class="tlabel">已知</span><span class="seg" id="givB"><button data-v="t">聽到回聲的時間</button><button data-v="d">距離</button></span>
        <label class="slider bt"><span class="tlabel">甲的回聲</span><input type="range" id="t1B" min="0.1" max="6" step="0.1" value="2"><output id="t1Bo"></output></label>
        <label class="slider bt"><span class="tlabel">再隔多久聽到乙</span><input type="range" id="dtB" min="0" max="6" step="0.1" value="1"><output id="dtBo"></output></label>
        <label class="slider bd"><span class="tlabel">人到甲</span><input type="range" id="d1B" min="10" max="1200" step="5" value="340"><output id="d1Bo"></output></label>
        <label class="slider bd"><span class="tlabel">人到乙</span><input type="range" id="d2B" min="10" max="1200" step="5" value="510"><output id="d2Bo"></output></label>
      </div>

      <!-- 移動中鳴笛 -->
      <div class="toolbar mctl" data-m="move">
        <span class="seg" id="vehC"><button data-v="ship">🚢 船</button><button data-v="train">🚆 火車</button><button data-v="dolphin">🐬 海豚</button></span>
        <span class="seg" id="dirC"><button data-v="to">駛向山壁</button><button data-v="away">駛離山壁</button></span>
        <span class="tlabel">已知</span><span class="seg" id="givC"><button data-v="t">聽到回聲的時間</button><button data-v="d">鳴笛時的距離</button></span>
      </div>
      <div class="toolbar mctl" data-m="move">
        <label class="slider" id="tCw"><span class="tlabel">回聲時間</span><input type="range" id="tC" min="0.1" max="12" step="0.1" value="4"><output id="tCo"></output></label>
        <label class="slider" id="dCw"><span class="tlabel">鳴笛時距離</span><input type="range" id="dC" min="1" max="2000" step="1" value="680"><output id="dCo"></output></label>
        <label class="slider"><span class="tlabel">移動速率</span><input type="range" id="uC" min="0" max="60" step="1" value="10"><output id="uCo"></output></label>
        <label class="slider"><span class="tlabel">反應時間</span><input type="range" id="rC" min="0" max="1" step="0.05" value="0"><output id="rCo"></output></label>
      </div>

      <!-- 測深 -->
      <div class="toolbar mctl" data-m="depth">
        <span class="seg" id="scD">
          <button data-v="well">深井（空氣）</button>
          <button data-v="sonar">聲納測海深</button>
          <button data-v="heli">直升機→潛艇</button>
          <button data-v="sub">潛艇→直升機</button>
          <button data-v="spk">喇叭與半滿深井</button>
          <button data-v="metal">金屬探傷</button>
        </span>
      </div>
      <div class="toolbar mctl" data-m="depth">
        <span class="tlabel">已知</span><span class="seg" id="givD"><button data-v="t">回聲時間</button><button data-v="h">深度</button></span>
        <label class="slider" id="tDw"><span class="tlabel">回聲時間</span><input type="range" id="tD" min="0" max="1" step="0.001" value="0.2"><output id="tDo"></output></label>
        <label class="slider" id="hDw"><span class="tlabel" id="hDl">深度</span><input type="range" id="hD" min="0" max="1" step="0.5" value="34"><output id="hDo"></output></label>
        <label class="slider" id="h0Dw"><span class="tlabel" id="h0Dl">高度</span><input type="range" id="h0D" min="0" max="1" step="1" value="68"><output id="h0Do"></output></label>
        <label class="slider" id="TDw"><span class="tlabel">氣溫</span><input type="range" id="TD" min="-10" max="40" step="1" value="15"><output id="TDo"></output></label>
      </div>

      <!-- 海底地形 -->
      <div class="toolbar mctl" data-m="map">
        <span class="tlabel">回聲時間（秒）</span><span class="chips" id="preM"></span>
        <label class="tog"><input type="checkbox" id="hideM">先遮住海底，猜猜看</label>
      </div>

      <!-- 反射定律 -->
      <div class="toolbar mctl" data-m="law">
        <span class="tlabel">聽的水管放在</span><span class="seg" id="posF"><button data-v="20">甲</button><button data-v="40">乙</button><button data-v="62">丙</button></span>
        <span class="tlabel">反射板</span><span class="seg" id="matF"><button data-v="iron">鐵板</button><button data-v="wood">木板</button><button data-v="cotton">棉布</button><button data-v="sponge">海綿</button><button data-v="none">拿掉</button></span>
      </div>

      <div class="cbox"><canvas id="cvA" aria-label="回聲動畫"></canvas></div>
      <div class="cbox" id="cvXw"><p class="gcap" id="capX"></p><canvas id="cvX" aria-label="位置與時間圖"></canvas></div>
      <p class="hint" id="hintE" style="padding:0 12px 10px"></p>
    </div>
    <div class="grid2">
      <section class="panel box">
        <p class="big" id="rEbig"></p>
        <div class="formula2" id="rEf"></div>
        <div id="cvEw"><p class="gcap" id="capE">耳朵聽到的聲音（橫軸是時間）</p><canvas id="cvE" aria-label="耳朵聽到的聲音"></canvas></div>
        <ul class="checks" id="rEc"></ul>
      </section>
      <section class="panel box">
        <h3 id="howT">怎麼看</h3>
        <ul id="howL"></ul>
      </section>
    </div>
  </section>

  <section class="panel" id="qpanel">
    <p class="ptitle">題目情境 <small>講義頁碼為翰林《超級翰將講義 自然(3)》學生版；考古題標示學校、學年-學期-次別與題號</small></p>
    <div class="cbox" id="qbox"></div>
  </section>
</div>
<script>
// ================= common =================
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,f)=>a+(b-a)*f,TAU=Math.PI*2,D2R=Math.PI/180;
const DPR=()=>Math.min(window.devicePixelRatio||1,2);
const C={};
function readColors(){const s=getComputedStyle(document.documentElement);
  ['bg','panel','ink','muted','line','grid','accent','accent-soft','blue','green','red','purple','ray','water','w1','w2','sum'].forEach(k=>C[k]=s.getPropertyValue('--'+k).trim());}
readColors();
function fit(cv,ratio,minH,maxH){if(!cv.clientWidth&&cv.width>20){const d=DPR();return{W:cv.width/d,H:cv.height/d};}const w=Math.max(10,cv.clientWidth);const h=Math.round(clamp(w*ratio,minH,maxH));
  cv.style.height=h+'px';const d=DPR();cv.width=Math.round(w*d);cv.height=Math.round(h*d);cv.getContext('2d').setTransform(d,0,0,d,0,0);return{W:w,H:h};}
function segSet(el,v){el.querySelectorAll('button[data-v]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===String(v))));}
function segOn(el,fn){el.addEventListener('click',e=>{const b=e.target.closest('button[data-v]');if(b)fn(b.dataset.v);});}
const FONT='"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif';
function text(g,s,x,y,{col=C.ink,size=13,bold=false,align='left',base='alphabetic',bg=null}={}){
  g.font=`${bold?700:500} ${size}px ${FONT}`;g.textAlign=align;g.textBaseline=base;
  {const w=g.measureText(s).width,cw=g.canvas.clientWidth||1e9;let px=align==='center'?x-w/2:align==='right'?x-w:x;const sh=Math.max(6-px,0)+Math.min(cw-6-(px+w),0);x+=sh;}
  if(bg){const w=g.measureText(s).width,px=align==='center'?x-w/2:align==='right'?x-w:x,py=base==='middle'?y-size/2:y-size;g.save();g.fillStyle=bg;g.globalAlpha=.85;g.fillRect(px-4,py-2,w+8,size+6);g.restore();}
  g.fillStyle=col;g.fillText(s,x,y);}
function line(g,x1,y1,x2,y2,col,w=2,dash=null){g.strokeStyle=col;g.lineWidth=w;g.setLineDash(dash||[]);g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke();g.setLineDash([]);}
function head(g,x,y,ang,col,size=9){g.fillStyle=col;g.beginPath();g.moveTo(x+Math.cos(ang)*size*.5,y+Math.sin(ang)*size*.5);g.lineTo(x-size*Math.cos(ang-.45),y-size*Math.sin(ang-.45));g.lineTo(x-size*Math.cos(ang+.45),y-size*Math.sin(ang+.45));g.closePath();g.fill();}
function arrow(g,x1,y1,x2,y2,col,w=2){line(g,x1,y1,x2,y2,col,w);head(g,x2,y2,Math.atan2(y2-y1,x2-x1),col,10);}
function handle(g,x,y,r=9){g.fillStyle=C.accent;g.beginPath();g.arc(x,y,r,0,TAU);g.fill();g.strokeStyle=C.panel;g.lineWidth=2;g.stroke();}
function dragger(cv,handles,after){let cur=null;const pos=ev=>{const r=cv.getBoundingClientRect();return[ev.clientX-r.left,ev.clientY-r.top];};
  const pick=(x,y)=>{let best=null,bd=1e9;for(const h of handles()){const d=h.hit?h.hit(x,y):Math.hypot(x-h.x,y-h.y);if(d<(h.r||26)&&d<bd){bd=d;best=h;}}return best;};
  cv.addEventListener('pointerdown',ev=>{const[x,y]=pos(ev);const h=pick(x,y);if(!h)return;cur={h,dx:h.free?0:h.x-x,dy:h.free?0:h.y-y};h.start&&h.start();cv.setPointerCapture(ev.pointerId);ev.preventDefault();});
  cv.addEventListener('pointermove',ev=>{const[x,y]=pos(ev);if(!cur){cv.style.cursor=pick(x,y)?'grab':'default';return;}cur.h.move(x+cur.dx,y+cur.dy);after();});
  const up=()=>{cur=null;};cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);}
function nmRGBa(nm){let r=0,g=0,b=0;if(nm<440){r=-(nm-440)/60;b=1;}else if(nm<490){g=(nm-440)/50;b=1;}else if(nm<510){g=1;b=-(nm-510)/20;}else if(nm<580){r=(nm-510)/70;g=1;}else if(nm<645){r=1;g=-(nm-645)/65;}else r=1;
  let f=1;if(nm<420)f=.45+.55*(nm-380)/40;else if(nm>700)f=.45+.55*(780-nm)/80;return[r*f,g*f,b*f].map(v=>clamp(v,0,1));}
const rgbStr=(a,k=1)=>`rgb(${a.map(v=>Math.round(255*Math.pow(clamp(v*k,0,1),.8))).join(',')})`;
const nmCol=nm=>rgbStr(nmRGBa(nm));
const f1=x=>(Math.round(x*10)/10).toFixed(1),f2=x=>(Math.round(x*100)/100).toFixed(2);
const checks=(el,L)=>{el.innerHTML=L.map(([c,t])=>`<li class="${c}"><span>${t}</span></li>`).join('');};

// ================= 狀態 =================
function readMore(){const s=getComputedStyle(document.documentElement);['snd','echo','cliff','sea','sky'].forEach(k=>C[k]=s.getPropertyValue('--'+k).trim());}
readMore();
const vAir=T=>331+0.6*T;
const E={mode:'wall',t:0,run:true,spd:3,med:'air',T:15,vc:340,real:false,
  A:{giv:'d',d:34,tt:.2,mat:'hard'},
  B:{giv:'t',t1:2,dt:1,d1:340,d2:510},
  C:{veh:'ship',dir:'to',giv:'t',tt:4,D:680,u:10,re:0},
  D:{sc:'well',giv:'t',tt:.2,h:34,h0:68,T:15},
  M:{ts:[30,15,28,5,5],hide:false},
  F:{ang:40,mat:'iron'}};
const RMAT={hard:.85,cloth:.3,foam:.1};
const MATN={hard:'光滑堅硬',cloth:'布幔、地毯',foam:'多孔吸音板'};
const RF={iron:.9,wood:.7,cotton:.25,sponge:.1,none:0};
const RFN={iron:'鐵板',wood:'木板',cotton:'棉布',sponge:'海綿',none:'沒有反射板'};
function vS(){return E.med==='air'?vAir(E.T):E.med==='water'?1500:E.vc;}
const fmtT=t=>{const a=Math.abs(t);if(a===0)return '0 s';if(a<1e-3)return (Math.round(t*1e7)/10)+' µs';if(a<.01)return (Math.round(t*1e4)/10)+' ms';if(a<.1)return t.toFixed(3)+' s';if(a<10)return f2(t)+' s';return f1(t)+' s';};
const fmtS=t=>{const a=Math.abs(t);if(a<1e-3)return (Math.round(t*1e8)/100)+' 微秒';if(a<10)return (Math.round(t*1000)/1000).toString().replace(/\.?0+$/,'')+' 秒';return f1(t)+' 秒';};
const nf=(x,dp=2)=>{const r=Math.round(x*10**dp)/10**dp;return r.toString();};
const fmtM=m=>{const a=Math.abs(m);if(a<1)return nf(m*100,1)+' cm';if(a<100)return nf(m,2)+' m';return nf(m,1)+' m';};

// ---------- 各情境的模型 ----------
function mA(){const v=vS(),A=E.A;const d=A.giv==='d'?A.d:v*A.tt/2;const te=2*d/v;const r=RMAT[A.mat];
  return {v,d,te,r,tmax:Math.max(te*1.25,.3),hear:[{t:0,a:1,lab:'原聲'},{t:te,a:r,lab:'回聲'}]};}
const WN=['甲','乙'];
function mB(){const v=vS(),B=E.B;let d1,d2;if(B.giv==='t'){d1=v*B.t1/2;d2=v*(B.t1+B.dt)/2;}else{d1=B.d1;d2=B.d2;}
  const L=d1+d2,s=d1,r=.8;const imgs=[];
  for(const first of [0,1])for(let n=1;n<=4;n++){let p=s;const seq=[];for(let k=0;k<n;k++){const w=(first+k)%2;seq.push(w);p=w===0?-p:2*L-p;}
    imgs.push({p,n,seq,t:Math.abs(p-s)/v,a:Math.pow(r,n)});}
  imgs.sort((a,b)=>a.t-b.t);const arr=[];
  for(const im of imgs){const g=arr.find(x=>Math.abs(x.t-im.t)<1e-7*(1+im.t));if(g){g.ims.push(im);g.a=Math.min(1,g.a+im.a);}else arr.push({t:im.t,ims:[im],a:im.a});}
  arr.forEach((g,i)=>{g.k=i+1;g.lab=g.ims.map(im=>im.seq.map(w=>WN[w]).join('→')).join('、');});
  const tmax=arr[Math.min(3,arr.length-1)].t*1.08;
  const hear=[{t:0,a:1,lab:'原聲'}].concat(arr.filter(g=>g.t<=tmax).map(g=>({t:g.t,a:g.a,lab:'第'+g.k+'聲'})));
  return {v,d1,d2,L,s,r,imgs,arr,tmax,hear};}

  const tmax=(te+C.re)*1.12+1e-4;const xh=sg*u*te,xr=sg*u*(te+C.re);
  return {v,u,sg,D,te,re:C.re,tmax,xh,xr,hear:[{t:0,a:1,lab:VEH[C.veh].hn},{t:te,a:.8,lab:'回聲'}]};}

function mD(){const D=E.D,S=SCD[D.sc];const vs=S.L.map(l=>l.v==='air'?vAir(D.T):l.v);
  let h=D.h,te,bad=false;const h0=S.L[0].fix?D.h0:0;
  const tOf=h=>S.L.length===1?2*h/vs[0]:S.L[0].fix?2*h0/vs[0]+2*h/vs[1]:2*h/vs[0]+2*h/vs[1];
  if(D.giv==='t'){te=D.tt;
    if(S.L.length===1)h=vs[0]*te/2;else if(S.L[0].fix){h=(te-2*h0/vs[0])*vs[1]/2;if(h<0){bad=true;h=0;}}else h=te/(2/vs[0]+2/vs[1]);}
  else te=tOf(h);
  const th=S.L.length===1?[h]:S.L[0].fix?[h0,h]:[h,h];
  const seg=th.map((x,i)=>x/vs[i]);
  return {S,vs,h,h0,th,seg,te,bad,tmax:te*1.1+1e-9,hear:[{t:0,a:1,lab:'發出'},{t:te,a:.75,lab:'回聲'}]};}

let AC=null,NB=null;
function clap(t0,gain){const s=AC.createBufferSource();s.buffer=NB;const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=1400;f.Q.value=.9;
  const g=AC.createGain();g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(gain,t0+.004);g.gain.exponentialRampToValueAtTime(.0008,t0+.09);
  s.connect(f);f.connect(g);g.connect(AC.destination);s.start(t0);s.stop(t0+.12);}
$('sndE').addEventListener('click',()=>{try{if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();NB=AC.createBuffer(1,AC.sampleRate*.15,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1);}
  AC.resume();const M=model();const t0=AC.currentTime+.08;(M.hear||[]).forEach(h=>{if(h.t<12)clap(t0+h.t,1.6*Math.max(.04,h.a));});
  E.t=0;E.run=true;E.real=true;playTxt($('playE'),true);kick();}catch(e){console.error(e);}});

  const hy=G-44;g.beginPath();g.arc(x,hy,9,0,TAU);g.stroke();
  g.beginPath();g.moveTo(x,hy+9);g.lineTo(x,G-16);g.moveTo(x,G-16);g.lineTo(x-7,G);g.moveTo(x,G-16);g.lineTo(x+7,G);
  g.moveTo(x,hy+15);g.lineTo(x+dir*9,hy+22);g.moveTo(x,hy+15);g.lineTo(x-dir*8,hy+24);g.stroke();
  g.beginPath();g.arc(x+dir*4,hy-2,1.6,0,TAU);g.fill();
  if(shout>0){g.globalAlpha=shout;g.lineWidth=2;for(let k=1;k<=3;k++){g.beginPath();g.arc(x+dir*6,hy+3,6+k*5,-.5+(dir<0?Math.PI:0),.5+(dir<0?Math.PI:0));g.stroke();}}

function cliffR(g,x,G,top,w=70){g.save();g.fillStyle=C.cliff;g.beginPath();g.moveTo(x+w,G);g.lineTo(x,G);
  const n=7;for(let i=1;i<=n;i++){const yy=G-(G-top)*i/n;g.lineTo(x+((i%2)?4:-3),yy);}g.lineTo(x+18,top-8);g.lineTo(x+w,top+6);g.closePath();g.fill();g.restore();}

  else{g.fillStyle='rgba(0,0,0,.28)';for(let y=top+5;y<G-3;y+=9)for(let xx=x+3;xx<x+w-3;xx+=8){g.beginPath();g.arc(xx+((y/9|0)%2)*3,y,2.2,0,TAU);g.fill();}}
  g.restore();}

function ring(g,cx,cy,r,col,a,w=3){if(r<=0||a<=.01)return;g.save();g.globalAlpha=a;g.strokeStyle=col;g.lineWidth=w;g.beginPath();g.arc(cx,cy,r,0,TAU);g.stroke();

  head(g,x1,y,Math.PI,col,8);head(g,x2,y,0,col,8);text(g,lab,(x1+x2)/2,y-6,{col,size,bold:true,align:'center',bg:C.panel});}

function rangeABC(M){if(E.mode==='wall'){const d=M.d;return [-d*.16,d*1.06];}
  if(E.mode==='cliff'){return [-M.L*.05,M.L*1.05];}
  const lo=Math.min(0,M.sg<0?-M.u*(M.te+M.re):0);return [lo-M.D*.12,M.D*1.06];}

// ================= 場景：對牆喊／兩峭壁／移動 =================
const fold=(x,L)=>{const P=2*L;let y=((x%P)+P)%P;const n=Math.floor(x/L);return [y>L?P-y:y,Math.abs(n)];};
function bgLand(g,W,H,G){g.fillStyle=C.sky;g.fillRect(0,0,W,G);g.fillStyle=C.grid;g.fillRect(0,G,W,H-G);line(g,0,G,W,G,C.muted,1.5);}
function drawA(g,W,H,M){const [x0,x1]=rangeABC(M),mp=xmap(W,x0,x1),G=H*.72,top=H*.1,t=E.t,v=M.v;bgLand(g,W,H,G);
  const xw=mp.X(M.d),xp=mp.X(0),ys=G-40;
  // 0.1 秒界線
  const d17=v*.1/2;if(d17<x1*.98){const xx=mp.X(d17);line(g,xx,G,xx,top+24,C.green,1.3,[5,4]);text(g,'離牆 '+nf(d17,1)+' m 以上才分得出回聲',xx+(xx<W*.6?6:-6),top+20,{col:C.green,size:11,bold:true,align:xx<W*.6?'left':'right'});}
  g.save();g.beginPath();g.rect(0,0,xw,G);g.clip();
  ring(g,xp,ys,v*t*mp.s,C.snd,1-.4*t/M.tmax);
  if(v*t>M.d)ring(g,mp.X(2*M.d),ys,v*t*mp.s,C.echo,M.r*(1-.3*t/M.tmax));
  g.restore();
  wallA(g,xw,G,top,E.A.mat);text(g,MATN[E.A.mat],xw+11,top-6,{size:12,bold:true,align:'center'});
  person(g,xp,G,1,C.ink,t<M.tmax*.06?1:0);
  // 追蹤一小段聲音
  const s=v*t;if(s<=2*M.d){const x=s<M.d?s:2*M.d-s;dot(g,mp.X(x),ys,s<M.d?C.snd:C.echo);}
  if(t>=M.te){text(g,M.te<.1?'回聲回來了，但和原聲混在一起':'聽到回聲！',xp+16,G-66,{col:C.echo,size:13,bold:true,bg:C.panel});ear(g,xp-1,G-44,C.echo);}
  dimLine(g,xp,xw,G+22,'d = '+fmtM(M.d));if(E.A.giv==='d')handle(g,xw+11,G-(G-top)/2,9);
  const yb=G+44;if(s>0){const go=Math.min(s,M.d);arrow(g,xp,yb,mp.X(go),yb,C.snd,2.5);
    if(s>M.d){const back=Math.min(s,2*M.d)-M.d;arrow(g,xw,yb+12,mp.X(M.d-back),yb+12,C.echo,2.5);}
    text(g,'聲音已走 '+fmtM(Math.min(s,2*M.d))+(s>=2*M.d?'＝ 2d（來回）':''),W-12,H-8,{size:12,bold:true,align:'right',col:s>=2*M.d?C.echo:C.snd});}}
function drawB(g,W,H,M){const [x0,x1]=rangeABC(M),mp=xmap(W,x0,x1),G=H*.72,top=H*.12,t=E.t,v=M.v;bgLand(g,W,H,G);
  const xa=mp.X(0),xb=mp.X(M.L),xp=mp.X(M.s),ys=G-40,fd=1-.35*t/M.tmax;
  g.save();g.beginPath();g.rect(xa,0,xb-xa,G);g.clip();
  ring(g,xp,ys,v*t*mp.s,C.snd,fd);
  for(const im of M.imgs)if(v*t>Math.abs(im.p-M.s)/2)ring(g,mp.X(im.p),ys,v*t*mp.s,RC(im.n),im.a*fd,2.5);
  g.restore();

  text(g,'甲',xa-22,top+18,{size:16,bold:true,col:'#fff',align:'center'});text(g,'乙',xb+22,top+18,{size:16,bold:true,col:'#fff',align:'center'});

  dimLine(g,xa,xp,G+22,'人到甲 '+fmtM(M.d1),C.ink,12);dimLine(g,xp,xb,G+22,'人到乙 '+fmtM(M.d2),C.ink,12);
  dimLine(g,xa,xb,G+50,'兩峭壁相距 '+fmtM(M.L),C.purple,12);

function drawC(g,W,H,M){const [x0,x1]=rangeABC(M),mp=xmap(W,x0,x1),t=E.t,v=M.v,veh=E.C.veh,G=H*.66,top=H*.1;

  else if(veh==='train'){bgLand(g,W,H,G);line(g,0,G-1,W,G-1,C.ink,2);ys=G-26;}
  else{g.fillStyle=C.sky;g.fillRect(0,0,W,top);g.fillStyle=C.sea;g.fillRect(0,top,W,G-top);g.fillStyle=C.grid;g.fillRect(0,G,W,H-G);ys=(top+G)/2;clipTop=top;}
  g.save();g.beginPath();g.rect(0,clipTop,xw,G-clipTop);g.clip();

  if(veh==='dolphin'){g.fillStyle='#8f9aa3';g.fillRect(xw,top-6,20,G-top+6);text(g,'池壁',xw+10,top-10,{size:12,bold:true,align:'center'});}
  else{cliffR(g,xw,G,top);if(veh==='train'){g.fillStyle='#1a1a1a';g.beginPath();g.moveTo(xw+2,G);g.lineTo(xw+2,G-30);g.quadraticCurveTo(xw+22,G-48,xw+42,G-30);g.lineTo(xw+42,G);g.fill();text(g,'隧道',xw+22,G-52,{size:11,col:'#fff',align:'center',bold:true});}
    else text(g,'山壁',xw+30,top+18,{size:13,col:'#fff',bold:true,align:'center'});}
  // 鳴笛處
  line(g,xe,top+6,xe,H-4,C.muted,1.2,[4,4]);text(g,VEH[veh].hn+'處',xe,top+2,{size:11,col:C.muted,align:'center'});
  const tv=Math.min(t,M.te+M.re),xv=mp.X(M.sg*M.u*tv),dir=M.sg;
  g.save();g.globalAlpha=.25;if(veh==='ship')ship(g,xe,G,dir);else if(veh==='train')train(g,xe,G,dir);else dolphin(g,xe,ys,dir);g.restore();
  if(veh==='ship')ship(g,xv,G,dir);else if(veh==='train')train(g,xv,G,dir);else dolphin(g,xv,ys,dir);
  if(t<M.tmax*.05){g.save();g.strokeStyle=C.snd;g.lineWidth=2;for(let k=1;k<=3;k++){g.beginPath();g.arc(xe+dir*30,ys-8,5+k*5,-.6,.6);g.stroke();}g.restore();}
  const s=v*t;if(t<M.te){const x=s<M.D?s:2*M.D-s;dot(g,mp.X(x),ys,s<M.D?C.snd:C.echo);}
  if(t>=M.te){const st=t>=M.te+M.re&&M.re>0;const left=M.D-M.sg*M.u*(M.te+M.re);
    text(g,st?'停住！離'+VEH[veh].wall+'還有 '+fmtM(left):M.re>0?'聽到回聲，反應中…':'聽到回聲！',xv,top+(veh==='dolphin'?-4:26),{col:C.echo,size:13,bold:true,align:'center',bg:C.panel});}
  // 線段圖

  if(s>0){const go=Math.min(s,M.D);line(g,xe,y1,mp.X(go),y1,C.snd,3.5);
    if(s>M.D){const back=Math.min(s,2*M.D-M.sg*M.u*Math.min(t,M.te))-M.D;if(back>0){line(g,xw,y1+7,mp.X(M.D-back),y1+7,C.echo,3.5);}}
    const su=v*Math.min(t,M.te);text(g,'聲音走 v·t = '+fmtM(su),W-10,y1+4,{size:12,bold:true,col:C.snd,align:'right',bg:C.panel});}
  const ut=M.u*Math.min(t,M.te);if(ut>0){line(g,xe,y2,mp.X(M.sg*ut),y2,C.green,3.5);text(g,VEH[veh].n+'走 u·t = '+fmtM(ut),W-10,y2+4,{size:12,bold:true,col:C.green,align:'right',bg:C.panel});}
  if(H-G>70)dimLine(g,xe,xw,y3,'D = '+fmtM(M.D),C.ink,12);}

// ================= 位置－時間圖 =================
function niceStep(T){const raw=T/5,p=10**Math.floor(Math.log10(raw));for(const k of [1,2,5,10])if(raw<=k*p)return k*p;return 10*p;}
function drawXT(g,W,H,M){g.clearRect(0,0,W,H);const [x0,x1]=rangeABC(M),mp=xmap(W,x0,x1),T0=16,BT=H-10,ty=t=>T0+t/M.tmax*(BT-T0),v=M.v;
  g.fillStyle=C.panel;g.fillRect(0,0,W,H);
  const st=niceStep(M.tmax);for(let tt=0;tt<=M.tmax+1e-9;tt+=st){const y=ty(tt);line(g,mp.L-4,y,W-8,y,C.grid,1);text(g,fmtT(tt),mp.L-8,y+4,{size:10,col:C.muted,align:'right'});}
  text(g,'時間 ↓',6,BT,{size:10,col:C.muted});
  const poly=(pts,col,w=2.4,dash=null)=>{g.strokeStyle=col;g.lineWidth=w;g.setLineDash(dash||[]);g.beginPath();pts.forEach(([x,t],i)=>{const px=mp.X(x),py=ty(t);i?g.lineTo(px,py):g.moveTo(px,py);});g.stroke();g.setLineDash([]);};
  const hit=(x,t,col,lab)=>{dot(g,mp.X(x),ty(t),col,5.5);if(lab)text(g,lab,mp.X(x)+9,ty(t)+4,{size:11,bold:true,col,bg:C.panel});};
  if(E.mode==='wall'){const xw=mp.X(M.d);g.fillStyle='#9aa3ab';g.fillRect(xw,T0,6,BT-T0);
    if(.1<M.tmax){g.fillStyle=C.green;g.globalAlpha=.12;g.fillRect(mp.X(0)-34,ty(0),68,ty(.1)-ty(0));g.globalAlpha=1;text(g,'0.1 s 內分不出',mp.X(0)-30,ty(.1)+13,{size:10,col:C.green,bold:true});}
    poly([[0,0],[0,M.tmax]],C.ink,3);poly([[0,0],[-v*M.tmax,M.tmax]],C.snd,1.5,[4,4]);
    poly([[0,0],[M.d,M.d/v],[0,M.te]],C.snd,2.4);poly([[M.d,M.d/v],[0,M.te]],C.echo,2.4);
    hit(0,M.te,C.echo,'聽到回聲 '+fmtT(M.te));text(g,'人',mp.X(0),T0-3,{size:11,bold:true,align:'center'});text(g,'牆',xw+3,T0-3,{size:11,bold:true,align:'center'});}
  else if(E.mode==='cliff'){g.fillStyle=C.cliff;g.fillRect(mp.X(0)-6,T0,6,BT-T0);g.fillRect(mp.X(M.L),T0,6,BT-T0);
    poly([[M.s,0],[M.s,M.tmax]],C.ink,3);
    for(const dir of [-1,1]){let x=M.s,t=0,n=0,d=dir;while(t<M.tmax&&n<6){const wx=d<0?0:M.L;const dt=Math.abs(wx-x)/v;const t2=Math.min(t+dt,M.tmax);const x2=x+d*v*(t2-t);poly([[x,t],[x2,t2]],RC(n),2.2);x=x2;t=t2;n++;d=-d;}}
    for(const a of M.arr)if(a.t<=M.tmax)hit(M.s,a.t,RC(a.ims[0].n),'第'+a.k+'聲 '+fmtT(a.t));
    text(g,'甲',mp.X(0)-3,T0-3,{size:11,bold:true,align:'center'});text(g,'乙',mp.X(M.L)+3,T0-3,{size:11,bold:true,align:'center'});text(g,'人',mp.X(M.s),T0-3,{size:11,bold:true,align:'center'});}
  else{const xw=mp.X(M.D);g.fillStyle=C.cliff;g.fillRect(xw,T0,6,BT-T0);
    const pts=[[0,0],[M.sg*M.u*(M.te+M.re),M.te+M.re]];if(M.tmax>M.te+M.re)pts.push([M.sg*M.u*(M.te+M.re),M.tmax]);poly(pts,C.green,3);
    poly([[0,0],[M.D,M.D/v]],C.snd,2.4);poly([[M.D,M.D/v],[M.xh,M.te]],C.echo,2.4);
    hit(M.xh,M.te,C.echo,'聽到回聲 '+fmtT(M.te));text(g,VEH[E.C.veh].n,mp.X(0),T0-3,{size:11,bold:true,align:'center'});text(g,VEH[E.C.veh].wall,xw+3,T0-3,{size:11,bold:true,align:'center'});}
  const yn=ty(Math.min(E.t,M.tmax));line(g,mp.L-4,yn,W-8,yn,C.accent,1.5,[6,4]);text(g,'現在',W-10,yn-4,{size:10,col:C.accent,bold:true,align:'right'});}

// ================= 耳朵聽到的 =================
function drawEar(g,W,H,M){g.clearRect(0,0,W,H);g.fillStyle=C.panel;g.fillRect(0,0,W,H);const L=14,R=W-14,base=H*.58,X=t=>L+t/M.tmax*(R-L),amp=H*.36;
  if(E.mode!=='depth'&&.1<M.tmax){g.fillStyle=C.green;g.globalAlpha=.12;g.fillRect(X(0),6,X(.1)-X(0),H-26);g.globalAlpha=1;}
  line(g,L,base,R,base,C.line,1);
  for(const h of M.hear){const x0=X(h.t),shown=E.t>=h.t,col=h.t===0?C.snd:C.echo;const w=Math.max(10,Math.min(26,(R-L)*.04));
    g.strokeStyle=col;g.lineWidth=1.6;g.globalAlpha=shown?1:.18;g.beginPath();for(let k=0;k<=60;k++){const u=k/60,x=x0+u*w,y=base-amp*h.a*Math.exp(-u*3.2)*Math.sin(u*TAU*5);k?g.lineTo(x,y):g.moveTo(x,y);}g.stroke();g.globalAlpha=1;
    if(shown)text(g,h.lab,x0+2,H-6,{size:11,col,bold:true});}
  if(E.mode!=='depth'&&.1<M.tmax)text(g,'← 0.1 s →',X(.05),14,{size:10,col:C.green,bold:true,align:'center'});
  const xn=X(Math.min(E.t,M.tmax));line(g,xn,4,xn,H-18,C.accent,1.5);}

// ================= 測深 =================
function zAt(M,t){const tt=t<=M.te/2?t:M.te-t;let z=0,acc=0;for(let i=0;i<M.th.length;i++){if(tt<=acc+M.seg[i]){return z+(tt-acc)*M.vs[i];}acc+=M.seg[i];z+=M.th[i];}return z;}
function drawD(g,W,H,M){const D=E.D,S=M.S,sc=D.sc,t=E.t;g.fillStyle=C.panel;g.fillRect(0,0,W,H);

    for(let i=0;i<8;i++){const fx=xl+40+i*((xr-xl-80)/7);g.fillStyle=C.muted;g.beginPath();g.ellipse(fx,top+(yEnd-top)*.45+Math.sin(i*1.7)*8,7,3,0,0,TAU);g.fill();}

  else if(sc==='sub'){g.fillStyle=C.sky;g.fillRect(0,0,W,y1);g.fillStyle=C.sea;g.fillRect(0,y1,W,H-y1);line(g,0,y1,xr+20,y1,C.snd,1.5);text(g,'水面',xl,y1-5,{size:11,col:C.snd,bold:true});heli(g,cx,yEnd-14);sub(g,cx,bot+12);}
  else{g.fillStyle='#9aa3ab';g.fillRect(xl,top,xr-xl,H-top-6);g.strokeStyle=C.ink;g.lineWidth=3;g.beginPath();for(let x=cx-50;x<=cx+50;x+=10)g.lineTo(x,yEnd+((x/10)%2?4:-4));g.stroke();

    arrow(g,cx+w/2+12,y,cx+w/2+12,y+(back?-dir:dir)*16,back?C.echo:C.snd,2);}

  // 尺寸

    text(g,S.L[i].m+' '+fmtM(h),xd+10,ym-2,{size:13,bold:true});text(g,'聲速 '+nf(M.vs[i],1)+' m/s',xd+10,ym+15,{size:11,col:C.muted});});
  if(M.bad)text(g,'時間太短：第一段來回就不只這麼久了',W-10,H-8,{col:'#c0453b',size:12,bold:true,align:'right'});}
function drawDT(g,W,H,M){g.clearRect(0,0,W,H);g.fillStyle=C.panel;g.fillRect(0,0,W,H);const L=14,R=W-14,y=H*.42,bh=Math.min(40,H*.3);
  const parts=[];M.seg.forEach((s,i)=>parts.push({s,i,back:false}));M.seg.slice().reverse().forEach((s,j)=>parts.push({s,i:M.seg.length-1-j,back:true}));

    if(xb-xa>48)text(g,M.S.L[p.i].m+' '+fmtT(p.s),(xa+xb)/2,y+5,{size:11,bold:true,align:'center',col:C.ink});});
  text(g,'去程 →',L,y-bh/2-6,{size:11,col:C.snd,bold:true});text(g,'← 回程',R,y-bh/2-6,{size:11,col:C.echo,bold:true,align:'right'});
  text(g,'回聲時間 ＝ '+fmtT(M.te),(L+R)/2,y+bh/2+18,{size:12,bold:true,align:'center'});
  const xn=X(Math.min(E.t,M.te));line(g,xn,y-bh/2-2,xn,y+bh/2+2,C.accent,2.5);}

// ================= 聲納測海底 =================
const TSC=34;
function geoM(W,H){const ys=58,L=26,R=W-26,xs=i=>L+(i+.5)*(R-L)/NM,yd=t=>ys+18+t/TSC*(H-ys-30);return {ys,L,R,xs,yd};}
function mPhase(M,i){const u=E.t-i*PM;const dp=1.7*M.ts[i]/Math.max(...M.ts);return {u,dp,ping:u-.6};}
function drawM(g,W,H,M){const Gm=geoM(W,H),{ys,xs,yd}=Gm;g.fillStyle=C.sky;g.fillRect(0,0,W,ys);g.fillStyle=C.sea;g.fillRect(0,ys,W,H-ys);line(g,0,ys,W,ys,C.snd,1.2);
  const pts=[[0,yd(M.ts[0])]].concat(M.ts.map((t,i)=>[xs(i),yd(t)])).concat([[W,yd(M.ts[NM-1])]]);
  if(E.M.hide){g.fillStyle=C.muted;g.globalAlpha=.35;g.fillRect(0,ys+14,W,H-ys-14);g.globalAlpha=1;text(g,'海底遮起來了：看下方的回聲時間猜猜看',W/2,(ys+H)/2,{size:14,bold:true,align:'center',bg:C.panel});}
  else{g.fillStyle=C.cliff;g.beginPath();pts.forEach(([x,y],i)=>i?g.lineTo(x,y):g.moveTo(x,y));g.lineTo(W,H);g.lineTo(0,H);g.closePath();g.fill();}
  for(let i=0;i<NM;i++){text(g,'第'+(i+1)+'站',xs(i),ys-38,{size:11,col:C.muted,align:'center'});line(g,xs(i),ys-32,xs(i),ys-26,C.muted,1);}
  let i=clamp(Math.floor(E.t/PM),0,NM-1);const ph=mPhase(M,i);let sx;
  if(ph.u<.6){const xa=i?xs(i-1):Gm.L-30;sx=lerp(xa,xs(i),clamp(ph.u/.6,0,1));}else sx=xs(i);
  ship(g,sx,ys,1);
  for(let j=0;j<=i;j++){const p=mPhase(M,j);if(p.ping<0)continue;const q=p.ping/p.dp;if(q>=1){if(!E.M.hide)dot(g,xs(j),yd(M.ts[j]),C.echo,4);continue;}
    const yy=q<.5?lerp(ys+6,yd(M.ts[j]),q*2):lerp(yd(M.ts[j]),ys+6,(q-.5)*2);
    line(g,xs(j)-22,yy,xs(j)+22,yy,q<.5?C.snd:C.echo,3.5);}
  text(g,'東 →',W-8,ys-8,{size:12,bold:true,align:'right'});
  if(!E.M.hide)M.ts.forEach((t,j)=>handle(g,xs(j),yd(t),7));}
function drawMT(g,W,H,M){g.clearRect(0,0,W,H);g.fillStyle=C.panel;g.fillRect(0,0,W,H);const L=26,R=W-26,xs=i=>L+(i+.5)*(R-L)/NM,top=22,yd=t=>top+t/TSC*(H-top-18);
  line(g,L-10,top,R+10,top,C.ink,1.5);text(g,'回聲時間往下畫 ↓',L-10,14,{size:11,col:C.muted});
  const ends=[];for(let j=0;j<NM;j++){const p=mPhase(M,j);if(p.ping<=0)continue;const q=clamp(p.ping/p.dp,0,1);const el=q*M.ts[j];
    g.fillStyle=q>=1?C.echo:C.snd;g.globalAlpha=.75;g.fillRect(xs(j)-12,top,24,yd(el)-top);g.globalAlpha=1;
    if(q>=1){ends.push([xs(j),yd(M.ts[j])]);text(g,M.ts[j]+' s',xs(j),yd(M.ts[j])+14,{size:11,bold:true,align:'center'});}}
  if(ends.length>1){g.strokeStyle=C.ink;g.lineWidth=2;g.setLineDash([5,4]);g.beginPath();ends.forEach(([x,y],i)=>i?g.lineTo(x,y):g.moveTo(x,y));g.stroke();g.setLineDash([]);}}

// ================= 反射定律 =================
function geoF(W,H){const cx=W*.46,py=H*.16,g0=H*.12,Lt=Math.min(H*.56,W*.42);return {cx,py,g0,Lt};}
function tubeAt(G,ang,side){const a=ang*D2R,d=[side*Math.sin(a),Math.cos(a)];return {a:[G.cx+d[0]*G.g0,G.py+d[1]*G.g0],b:[G.cx+d[0]*(G.g0+G.Lt),G.py+d[1]*(G.g0+G.Lt)],d};}
function loudF(){const r=RF[E.F.mat];return r*Math.exp(-(((E.F.ang-40)/9)**2));}
function drawF(g,W,H){const G=geoF(W,H),F=E.F,r=RF[F.mat],t=E.t;g.fillStyle=C.panel;g.fillRect(0,0,W,H);g.fillStyle=C.grid;g.fillRect(0,G.py,W,H-G.py);
  const pw=Math.min(170,W*.24);if(F.mat!=='none'){g.fillStyle={iron:'#7d8790',wood:'#b08350',cotton:'#e9e2d0',sponge:'#e7c64a'}[F.mat];g.fillRect(G.cx-pw,G.py-14,pw*2,14);g.strokeStyle=C.ink;g.lineWidth=1;g.strokeRect(G.cx-pw,G.py-14,pw*2,14);
    text(g,RFN[F.mat],G.cx+pw+8,G.py-3,{size:13,bold:true});}else text(g,'（沒有反射板）',G.cx+pw+8,G.py-3,{size:13,col:C.muted});
  line(g,G.cx,G.py,G.cx,G.py+G.g0+G.Lt+10,C.muted,1.3,[6,5]);text(g,'法線',G.cx+4,G.py+G.g0+G.Lt+22,{size:11,col:C.muted});
  const T1=tubeAt(G,40,-1),T2=tubeAt(G,F.ang,1);
  [[20,'甲'],[40,'乙'],[62,'丙']].forEach(([a,n])=>{const T=tubeAt(G,a,1);text(g,n,T.b[0]+T.d[0]*46,T.b[1]+T.d[1]*46+5,{size:15,bold:true,col:a===F.ang?C.accent:C.muted,align:'center'});});
  const mir=tubeAt(G,40,1);line(g,G.cx,G.py,mir.b[0],mir.b[1],C.echo,1.4,[3,5]);
  const tube=T=>{g.lineCap='round';line(g,T.a[0],T.a[1],T.b[0],T.b[1],C.ink,20);line(g,T.a[0],T.a[1],T.b[0],T.b[1],C.panel,14);g.lineCap='butt';};
  tube(T1);tube(T2);
  // 時鐘與耳朵
  const ck=[T1.b[0]+T1.d[0]*20,T1.b[1]+T1.d[1]*20];g.fillStyle=C.panel;g.strokeStyle=C.ink;g.lineWidth=2.5;g.beginPath();g.arc(ck[0],ck[1],16,0,TAU);g.fill();g.stroke();
  const tk=(t%1)*TAU;line(g,ck[0],ck[1],ck[0]+Math.sin(tk)*11,ck[1]-Math.cos(tk)*11,C.accent,2);line(g,ck[0],ck[1],ck[0],ck[1]-7,C.ink,2.5);
  ear(g,T2.b[0]+T2.d[0]*18,T2.b[1]+T2.d[1]*18,C.ink);
  // 角度
  g.strokeStyle=C.snd;g.lineWidth=2;g.beginPath();g.arc(G.cx,G.py,G.g0*.75,Math.PI/2,Math.PI/2+40*D2R);g.stroke();
  text(g,'入射角 40°',G.cx-G.g0*.9,G.py+G.g0*1.2,{size:12,bold:true,col:C.snd,align:'right'});
  g.strokeStyle=C.echo;g.beginPath();g.arc(G.cx,G.py,G.g0*.6,Math.PI/2-40*D2R,Math.PI/2);g.stroke();
  text(g,'反射角 40°',G.cx+G.g0*.95,G.py+G.g0*.95,{size:12,bold:true,col:C.echo});
  // 聲音脈衝（每 1 秒滴答一次）
  const L1=G.g0+G.Lt;for(let k=Math.floor(t)-2;k<=Math.floor(t);k++){const ph=t-k;if(ph<0)continue;
    if(ph<.55){const f=ph/.55;const p=[lerp(T1.b[0],G.cx,f*(1)),lerp(T1.b[1],G.py,f)];const q=f*L1;const px=T1.b[0]-T1.d[0]*q,py=T1.b[1]-T1.d[1]*q;dot(g,px,py,C.snd,5);}
    else if(ph<1.25){const f=(ph-.55)/.7,rr=f*L1;
      if(r>0){g.save();g.globalAlpha=(1-f*.5)*Math.max(.12,r);g.strokeStyle=C.echo;g.lineWidth=4;g.beginPath();const a0=Math.PI/2-40*D2R;g.arc(G.cx,G.py,rr,a0-.3,a0+.3);g.stroke();g.restore();}
      else{const px=G.cx+T1.d[0]*-rr,py=G.py-T1.d[1]*rr;if(py>4)dot(g,px,py,C.snd,4);}
      if(f>.93&&loudF()>.05){g.save();g.globalAlpha=loudF();g.strokeStyle=C.echo;g.lineWidth=2;const ex=T2.b[0]+T2.d[0]*18,ey=T2.b[1]+T2.d[1]*18;for(let j=1;j<=3;j++){g.beginPath();g.arc(ex,ey,8+j*6,0,TAU);g.stroke();}g.restore();}}}
  // 響度表
  const lv=loudF(),mx=W-44,mh=H*.55,my=H*.25;g.strokeStyle=C.ink;g.lineWidth=1.5;g.strokeRect(mx,my,22,mh);g.fillStyle=C.echo;g.fillRect(mx+2,my+mh-mh*lv,18,mh*lv);
  text(g,'聽到的',mx+11,my-20,{size:11,align:'center'});text(g,'響度',mx+11,my-6,{size:11,align:'center'});
  handle(g,T2.b[0],T2.b[1],9);}
