<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>透鏡成像立體視角</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&display=swap">
<link rel="stylesheet" href="../shared/ui.css">
<script src="../shared/optics.js"></script>
<style>
/* 版面：標題 → 立體光學台（斜角透視，從物體端往成像端看）→ 控制區與數據區 */
:root {--axis: #7d8a99;--rail: #c3ccd6;--rail-side: #a9b4c0;--lens: #4f63d6;--lens-fill: rgba(79, 99, 214, 0.16);--zone: rgba(79, 99, 214, 0.10);--screen: rgba(120, 132, 148, 0.16);--screen-edge: #9aa6b4;--obj: #17775f;--flag: #111111;/* 旗子：黑色，與箭頭不同色，方便看出左右 */
  --img: #c0442a;--ray1: #e0572d;--ray2: #2a7bd6;--ray3: #b88400;}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {--axis: #6f7e8f;--rail: #2f3b4a;--rail-side: #253040;--lens: #8e9cff;--lens-fill: rgba(142, 156, 255, 0.2);--zone: rgba(142, 156, 255, 0.12);--screen: rgba(170, 182, 198, 0.12);--screen-edge: #5f6d7e;--obj: #4cc7a4;--flag: #f2f4f7;--img: #ff7c5e;--ray1: #ff7d55;--ray2: #5cabff;--ray3: #f1c13a;color-scheme: dark;}
}
:root[data-theme="dark"] {--axis: #6f7e8f;--rail: #2f3b4a;--rail-side: #253040;--lens: #8e9cff;--lens-fill: rgba(142, 156, 255, 0.2);--zone: rgba(142, 156, 255, 0.12);--screen: rgba(170, 182, 198, 0.12);--screen-edge: #5f6d7e;--obj: #4cc7a4;--flag: #f2f4f7;--img: #ff7c5e;--ray1: #ff7d55;--ray2: #5cabff;--ray3: #f1c13a;color-scheme: dark;}
.wrap { max-width: 1080px; margin: 0 auto; display: grid; gap: 18px; }
header { display: grid; gap: 4px; }

.bench { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.bench svg { display: block; width: 100%; height: auto; user-select: none; -webkit-user-select: none; }
#obj { cursor: grab; touch-action: none; outline: none; -webkit-tap-highlight-color: transparent; }
#obj:active { cursor: grabbing; }
#obj:focus-visible .grip { stroke: var(--ink); stroke-width: 3; }
.svg-label { font-family: var(--f-mono); fill: var(--ink); }
.svg-small { font-family: var(--f-mono); fill: var(--muted); }
.svg-cap { font-family: var(--f-body); fill: var(--muted); }

.rotate-hint { display: none; margin: 0; font-size: 0.88rem; color: var(--muted); }
@media (max-width: 600px) and (orientation: portrait) { .rotate-hint { display: block; } }
@media (max-width: 720px) {
  .wrap { gap: 12px; }
  .bench { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; box-shadow: 0 6px 14px -10px rgba(0, 0, 0, 0.35); }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
  .formula, .hint { font-size: 0.85rem; }
}

.below { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; }
@media (max-width: 720px) { .below { grid-template-columns: minmax(0, 1fr); } }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; display: grid; gap: 14px; align-content: start; }
.card h2 { margin: 0; font-size: 0.8rem; letter-spacing: 0.12em; color: var(--muted); font-weight: 500; }
.slider-row { display: grid; gap: 6px; }
.slider-row .top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.slider-row output { font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-size: 1.05rem; }
input[type="range"] { width: 100%;  height: 28px; margin: 0; }
.rays { display: grid; gap: 6px; }
.rays label { display: flex; align-items: center; gap: 10px; cursor: pointer; }
.swatch { width: 22px; height: 3px; border-radius: 2px; flex: none; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--lens); outline-offset: 2px; }
.chip.real { border-color: var(--img); color: var(--img); }
.chip.virtual { border-style: dashed; border-color: var(--img); color: var(--img); }
.chip.flip { border-color: var(--flag); color: var(--flag); }
.region { margin: 0; font-weight: 500; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="crumb"><a href="../">自然科模擬動畫</a> · 光學 · <a id="to2d" href="./">透鏡（側視）</a></div>
    <h1>透鏡成像立體視角</h1>
    <p class="formula sh-only">1/f = 1/p + 1/q　　m = −q / p</p>
    <p class="hint">從物體端往成像端看。先選凸透鏡或凹透鏡，再拖曳綠色箭頭改變物距和高度，也可以用下方拉桿。注意黑色旗子在像裡跑到哪一邊。</p>
    <p class="rotate-hint">手機橫拿，畫面會更大。</p>
  </header>

  <div class="bench">
    <svg id="scene" viewBox="0 0 1000 600" aria-label="透鏡成像立體光路圖">
      <defs>
        <clipPath id="clip"><rect x="0" y="0" width="1000" height="600"></rect></clipPath>
      </defs>
      <g id="dyn" clip-path="url(#clip)"></g>
      <g id="obj" tabindex="0" role="slider" aria-label="物體位置，用方向鍵調整"></g>
    </svg>
  </div>

  <div class="below">
    <section class="card" aria-label="控制">
      <h2>控制</h2>
      <div class="seg" role="group" aria-label="透鏡種類">
        <button id="tConvex" type="button" aria-pressed="true">凸透鏡</button>
        <button id="tConcave" type="button" aria-pressed="false">凹透鏡</button>
      </div>
      <div class="slider-row">
        <div class="top"><label for="fSlider">焦距 f</label><output id="fOut">60 公分</output></div>
        <input id="fSlider" type="range" min="20" max="100" step="1" value="60">
      </div>
      <div class="slider-row">
        <div class="top"><label for="pSlider">物距 p</label><output id="pSliderOut">150 公分</output></div>
        <input id="pSlider" type="range" min="5" max="240" step="1" value="150">
      </div>
      <div class="slider-row">
        <div class="top"><label for="hSlider">物高 h</label><output id="hSliderOut">40 公分</output></div>
        <input id="hSlider" type="range" min="10" max="80" step="1" value="40">
      </div>
      <div class="rays">
        <label><input type="checkbox" id="r1" checked><span class="swatch" style="background: var(--ray1)"></span><span id="r1Text">平行光軸 → 折射後通過焦點</span></label>
        <label><input type="checkbox" id="r2" checked><span class="swatch" style="background: var(--ray2)"></span>通過透鏡中心 → 直線前進</label>
        <label><input type="checkbox" id="r3" checked><span class="swatch" style="background: var(--ray3)"></span><span id="r3Text">通過焦點 → 折射後平行光軸</span></label>
        <label><input type="checkbox" id="r4" checked><span class="swatch" style="background: var(--flag)"></span>旗子尖端 → 通過透鏡中心（看左右）</label>
      </div>
      <button id="reset" type="button" class="btn">重設</button>
    </section>

    <section class="card" aria-label="數據">
      <h2>數據</h2>
      <p class="region" id="region"></p>
      <dl>
        <dt>物距 p</dt><dd id="pOut"></dd>
        <dt>像距 q</dt><dd id="qOut"></dd>
        <dt>物高 h</dt><dd id="hOut"></dd>
        <dt>像高 h′</dt><dd id="hiOut"></dd>
        <dt class="sh-only">放大率 m</dt><dd class="sh-only" id="mOut"></dd>
      </dl>
      <div class="verdict" id="verdict"></div>
      <p class="note" id="note"></p>
    </section>
  </div>
</div>

<script>
// ===== 座標系統（單位：公分）=====
// z：沿著光軸，透鏡在 z = 0，物體在 z = −p（左邊），實像在 z = +q
// y：往上
// x：從物體端往成像端看時的「右手邊」
const RAIL_Y = -110;      // 光學台軌道的高度（在光軸下方）
const LENS_R = 75;        // 透鏡半徑
const Z_MIN = -260, Z_MAX = 470;

const DEFAULT = { f: 60, p: 150, h: 40 };
let state = { ...DEFAULT };
let lensType = 'convex';   // 'convex' 凸透鏡、'concave' 凹透鏡
const isConcave = () => lensType === 'concave';
const signedF = () => (isConcave() ? -state.f : state.f);   // 凹透鏡的焦距取負值

const svg = document.getElementById('scene');
const dyn = document.getElementById('dyn');
const objG = document.getElementById('obj');

// ===== 相機：站在物體後方偏右上，往成像端看 =====
const deg = Math.PI / 180;
const CAM = { yaw: 46 * deg, pitch: 13 * deg, dist: 1700, target: [0, -25, 70], F: 3300, cx: 500, cy: 300 };
let fwd, rgt, up, C;
const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
function setupCamera() {
  const { yaw: a, pitch: b, dist, target: T } = CAM;
  fwd = [-Math.sin(a) * Math.cos(b), -Math.sin(b), Math.cos(a) * Math.cos(b)]; // 視線方向
  rgt = [Math.cos(a), 0, Math.sin(a)];                                         // 畫面的右方
  up = [fwd[1] * rgt[2] - fwd[2] * rgt[1], fwd[2] * rgt[0] - fwd[0] * rgt[2], fwd[0] * rgt[1] - fwd[1] * rgt[0]];
  C = [T[0] - fwd[0] * dist, T[1] - fwd[1] * dist, T[2] - fwd[2] * dist];       // 相機位置
}
// 把立體座標投影到畫面上（透視投影）
function P(x, y, z) {
  const d = [x - C[0], y - C[1], z - C[2]];
  const zc = dot(d, fwd);
  return [CAM.cx + CAM.F * dot(d, rgt) / zc, CAM.cy - CAM.F * dot(d, up) / zc, zc];
}
// 反過來：畫面上的一點 → 落在 x = 0 平面（物體所在的平面）上的 (y, z)
function unprojectX0(sx, sy) {
  const dx = (sx - CAM.cx) / CAM.F, dy = -(sy - CAM.cy) / CAM.F;
  const dir = [0, 1, 2].map(i => rgt[i] * dx + up[i] * dy + fwd[i]);
  const t = -C[0] / dir[0];
  return [C[1] + t * dir[1], C[2] + t * dir[2]];
}

// 螢幕越窄，字和線條放大越多
let K = 1;
function updateScale() {
  const w = svg.clientWidth || 1000;
  K = Math.min(2.2, Math.max(1, 720 / w));
  // 手機等窄螢幕：鏡頭拉近一點，像才看得清楚
  const zoom = K > 1.3 ? 1.5 : 1;
  CAM.F = 3300 * zoom;
  CAM.target = K > 1.3 ? [0, -5, 45] : [0, -25, 70];
  setupCamera();
}

// ===== 顏色快取 =====
const colors = {};
function readColors() {
  const st = getComputedStyle(document.documentElement);
  for (const n of ['axis', 'rail', 'rail-side', 'lens', 'lens-fill', 'zone', 'screen', 'screen-edge', 'obj', 'flag', 'img', 'ray1', 'ray2', 'ray3', 'ink', 'panel', 'muted']) {
    colors[n] = st.getPropertyValue(`--${n}`).trim();
  }
}
const css = n => colors[n];

// ===== 繪圖小工具（輸入都是立體座標）=====
const NEAR = 40;   // 太靠近相機的部分不畫
function clipNear(A, B) {
  // A、B 是 [x,y,z]；把線段裁到相機前方
  const za = dot([A[0] - C[0], A[1] - C[1], A[2] - C[2]], fwd);
  const zb = dot([B[0] - C[0], B[1] - C[1], B[2] - C[2]], fwd);
  if (za < NEAR && zb < NEAR) return null;
  if (za >= NEAR && zb >= NEAR) return [A, B];
  const t = (NEAR - za) / (zb - za);
  const M = [A[0] + (B[0] - A[0]) * t, A[1] + (B[1] - A[1]) * t, A[2] + (B[2] - A[2]) * t];
  return za < NEAR ? [M, B] : [A, M];
}
function seg(A, B, color, opts = {}) {
  const c = clipNear(A, B);
  if (!c) return '';
  const [p, q] = [P(...c[0]), P(...c[1])];
  const dash = opts.dash ? `stroke-dasharray="${opts.dash.split(' ').map(n => n * K).join(' ')}"` : '';
  const w = (opts.width ?? 2) * Math.sqrt(K);
  return `<line x1="${p[0]}" y1="${p[1]}" x2="${q[0]}" y2="${q[1]}" stroke="${color}" stroke-width="${w}" ${dash} opacity="${opts.opacity ?? 1}" stroke-linecap="round"/>`;
}
function poly(pts, fill, stroke, opts = {}) {
  const pp = pts.map(p => P(...p));
  if (pp.some(p => p[2] < NEAR)) return '';
  const dash = opts.dash ? `stroke-dasharray="${opts.dash.split(' ').map(n => n * K).join(' ')}"` : '';
  const sw = (opts.width ?? 1.5) * Math.sqrt(K);
  return `<polygon points="${pp.map(p => p[0] + ',' + p[1]).join(' ')}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}" ${dash} stroke-linejoin="round" opacity="${opts.opacity ?? 1}"/>`;
}
function label(pt, str, cls, opts = {}) {
  const p = P(...pt);
  if (p[2] < NEAR) return '';
  const size = (cls === 'svg-label' ? 15 : 12) * K;
  const style = opts.color ? `style="fill:${opts.color}"` : '';
  return `<text class="${cls}" x="${p[0] + (opts.dx ?? 0) * K}" y="${p[1] + (opts.dy ?? 0) * K}" font-size="${size}" text-anchor="${opts.anchor ?? 'middle'}" ${style}>${str}</text>`;
}

// ===== 箭頭與旗子的形狀 =====
// 畫在垂直於光軸的平面上；(x, y) 乘上放大率 m 就是像的形狀
// m 為負時 x、y 同時變號：上下顛倒「而且」左右相反
function shape(h) {
  const head = 0.24 * h, half = 0.13 * h;
  return {
    stemTop: [0, h - head],
    head: [[0, h], [-half, h - head], [half, h - head]],
    flag: [[0, 0.74 * h], [0.55 * h, 0.74 * h], [0.55 * h, 0.42 * h], [0, 0.42 * h]],  // 旗子在右手邊
    flagTip: [0.55 * h, 0.74 * h],
  };
}
// 在 z 平面上畫一個（縮放 m 倍的）箭頭加旗子
function arrowFlag(z, h, m, stemColor, flagColor, opts = {}) {
  const s = shape(h);
  const tf = ([x, y]) => [x * m, y * m, z];
  let out = '';
  const hollow = opts.hollow;
  out += poly(s.flag.map(tf), hollow ? 'none' : flagColor, flagColor, { width: 2, dash: opts.dash, opacity: hollow ? 0.9 : 0.92 });
  out += seg([0, 0, z], tf(s.stemTop), stemColor, { width: 4, dash: opts.dash });
  out += poly(s.head.map(tf), hollow ? 'none' : stemColor, stemColor, { width: 2, dash: opts.dash });
  return out;
}

// ===== 物體（可拖曳）只建立一次，之後只更新位置 =====
const SVGNS = 'http://www.w3.org/2000/svg';
function setAttrs(el, attrs) { for (const k in attrs) el.setAttribute(k, attrs[k]); }
function mk(tag, attrs) { const el = document.createElementNS(SVGNS, tag); setAttrs(el, attrs); objG.appendChild(el); return el; }
const objEls = {
  hit: mk('polygon', { fill: 'transparent' }),
  hitTip: mk('circle', { fill: 'transparent' }),
  post: mk('line', { 'stroke-linecap': 'round' }),
  flag: mk('polygon', { 'stroke-linejoin': 'round' }),
  stem: mk('line', { 'stroke-linecap': 'round' }),
  head: mk('polygon', { 'stroke-linejoin': 'round' }),
  grip: mk('circle', { class: 'grip', opacity: '0.3' }),
  label: mk('text', { class: 'svg-label', 'text-anchor': 'middle' }),
};
objEls.label.textContent = '物體';
const ptsAttr = pts => pts.map(p => { const q = P(...p); return q[0] + ',' + q[1]; }).join(' ');
function updateObject() {
  const { p, h } = state, z = -p, s = shape(h);
  const at = ([x, y]) => [x, y, z];
  const base = P(0, 0, z), top = P(0, h, z), sTop = P(...at(s.stemTop)), railP = P(0, RAIL_Y, z);
  const pad = 14;
  setAttrs(objEls.hit, { points: ptsAttr([[-pad, -pad, z], [0.55 * h + pad, -pad, z], [0.55 * h + pad, h + pad, z], [-pad, h + pad, z]]) });
  setAttrs(objEls.hitTip, { cx: top[0], cy: top[1], r: 30 * K });
  setAttrs(objEls.post, { x1: base[0], y1: base[1], x2: railP[0], y2: railP[1], stroke: css('rail-side'), 'stroke-width': 3 * Math.sqrt(K) });
  setAttrs(objEls.flag, { points: ptsAttr(s.flag.map(at)), fill: css('flag'), stroke: css('flag'), 'stroke-width': 2 * Math.sqrt(K) });
  setAttrs(objEls.stem, { x1: base[0], y1: base[1], x2: sTop[0], y2: sTop[1], stroke: css('obj'), 'stroke-width': 5 * Math.sqrt(K) });
  setAttrs(objEls.head, { points: ptsAttr(s.head.map(at)), fill: css('obj'), stroke: css('obj'), 'stroke-width': 2 * Math.sqrt(K) });
  setAttrs(objEls.grip, { cx: top[0], cy: top[1], r: 10 * K, fill: css('obj') });
  setAttrs(objEls.label, { x: top[0], y: top[1] - 14 * K, 'font-size': 15 * K, style: `fill:${css('obj')}` });
}

// ===== 物理計算（薄透鏡公式）=====
function solve() {
  const { p, h } = state;
  const f = signedF();
  if (Math.abs(p - f) < 0.01) return { none: true };   // 物體在凸透鏡焦點上：不成像
  const q = (p * f) / (p - f);   // 正 = 實像（透鏡另一側），負 = 虛像（物體同側）
  const m = -q / p;              // 負 = 倒立且左右相反，正 = 正立
  return { q, m, hi: m * h };
}

// ===== 繪圖 =====
let rafId = 0;
function scheduleRender() { if (!rafId) rafId = requestAnimationFrame(() => { rafId = 0; render(); }); }

function render() {
  const { f, p, h } = state;
  const r = solve();
  const show = id => document.getElementById(id).checked;
  let out = '';

  // 視角說明
  out += `<text class="svg-cap" x="${16 * K}" y="${26 * K}" font-size="${14 * K}">視角：從物體端往成像端看</text>`;

  // 光學台軌道（頂面＋側面）
  const RW = 16;
  out += poly([[RW, RAIL_Y, Z_MIN], [RW, RAIL_Y - 14, Z_MIN], [RW, RAIL_Y - 14, Z_MAX], [RW, RAIL_Y, Z_MAX]], css('rail-side'), 'none');
  out += poly([[-RW, RAIL_Y, Z_MIN], [RW, RAIL_Y, Z_MIN], [RW, RAIL_Y, Z_MAX], [-RW, RAIL_Y, Z_MAX]], css('rail'), 'none');

  // F 與 2F 之間的區域（畫在地面上）
  for (const side of [-1, 1]) {
    const z1 = side * f, z2 = side * 2 * f;
    out += poly([[-70, RAIL_Y, z1], [70, RAIL_Y, z1], [70, RAIL_Y, z2], [-70, RAIL_Y, z2]], css('zone'), 'none');
  }

  // 刻度（距離透鏡的公分數）
  const every = K > 1.5 ? 100 : 50;
  for (let z = -250; z <= 450; z += 10) {
    const big = z % 50 === 0;
    out += seg([RW, RAIL_Y, z], [RW + (big ? 10 : 5), RAIL_Y, z], css('axis'), { width: 1 });
    if (z % every === 0) out += label([RW + 16, RAIL_Y, z], Math.abs(z), 'svg-small', { anchor: 'start', dy: 4 });
  }
  out += label([RW + 16, RAIL_Y, 455], '公分', 'svg-small', { anchor: 'start', dy: 4 });

  // 光軸
  out += seg([0, 0, Z_MIN], [0, 0, Z_MAX + 300], css('axis'), { width: 1.5, dash: '8 6' });

  // F、2F 標記
  for (const side of [-1, 1]) {
    for (const k of [1, 2]) {
      const z = side * k * f;
      const name = (k === 2 ? '2F' : 'F') + (side > 0 ? '′' : '');
      const pt = P(0, 0, z);
      if (k === 1) out += `<circle cx="${pt[0]}" cy="${pt[1]}" r="${5 * K}" fill="${css('panel')}" stroke="${css('ink')}" stroke-width="${2 * Math.sqrt(K)}"/>`;
      else out += seg([0, -9, z], [0, 9, z], css('ink'), { width: 2.5 });
      out += label([0, 0, z], name, 'svg-label', { dy: 24 });
    }
  }

  const real = !r.none && r.q > 0;
  const virtual = !r.none && r.q < 0;
  const zo = -p;
  const s = shape(h);
  const tip = [0, h, zo];
  const ft = [s.flagTip[0], s.flagTip[1], zo];             // 旗子尖端
  const imgTip = r.none ? null : [0, r.hi, r.q];
  const imgFt = r.none ? null : [s.flagTip[0] * r.m, s.flagTip[1] * r.m, r.q];
  const FAR = 2200;
  const extend = (A, B) => { const t = (FAR - A[2]) / (B[2] - A[2]); return [A[0] + (B[0] - A[0]) * t, A[1] + (B[1] - A[1]) * t, FAR]; };

  // 實像：畫在屏幕上（屏幕在透鏡後方，先畫）
  if (real && r.q < 1200) {
    const Hs = Math.min(260, Math.max(55, Math.abs(r.hi) * 1.25 + 12));
    const Ws = Math.min(260, Math.max(55, Math.abs(r.hi) * 0.7 + 30));
    out += seg([0, -Hs, r.q], [0, RAIL_Y, r.q], css('rail-side'), { width: 3 });
    out += poly([[-Ws, -Hs, r.q], [Ws, -Hs, r.q], [Ws, Hs, r.q], [-Ws, Hs, r.q]], css('screen'), css('screen-edge'));
    out += arrowFlag(r.q, h, r.m, css('img'), css('flag'));
    out += label([0, Hs, r.q], '實像（屏幕上）', 'svg-label', { dy: -8, color: css('img') });
  }

  // 透鏡：一片圓形鏡片＋支架
  const ring = [];
  for (let i = 0; i < 64; i++) { const a = (i / 64) * 2 * Math.PI; ring.push([LENS_R * Math.cos(a), LENS_R * Math.sin(a), 0]); }
  out += seg([0, -LENS_R, 0], [0, RAIL_Y, 0], css('rail-side'), { width: 3 });
  if (isConcave()) {
    // 凹透鏡：邊緣比中間厚，畫出前後兩圈當作鏡片的厚邊
    const back = ring.map(([x, y]) => [x, y, -6]), front = ring.map(([x, y]) => [x, y, 6]);
    out += poly(back, 'none', css('lens'), { width: 2 });
    out += poly(front, css('lens-fill'), css('lens'), { width: 2.5 });
    for (const a of [0, Math.PI / 2, Math.PI, 1.5 * Math.PI]) {
      out += seg([LENS_R * Math.cos(a), LENS_R * Math.sin(a), -6], [LENS_R * Math.cos(a), LENS_R * Math.sin(a), 6], css('lens'), { width: 2 });
    }
  } else {
    out += poly(ring, css('lens-fill'), css('lens'), { width: 2.5 });
  }
  out += label([0, LENS_R, 0], isConcave() ? '凹透鏡' : '凸透鏡', 'svg-small', { dy: -8 });

  // ----- 光線（都從物體的箭頭尖端或旗子尖端出發）-----
  const conc = isConcave();
  const fs = signedF();   // 帶正負號的焦距
  // 沿著方向 d 往成像端（z 增加）延伸到很遠
  const extendDir = (A, d) => { if (d[2] < 0) d = d.map(v => -v); const t = (FAR - A[2]) / d[2]; return [A[0] + d[0] * t, A[1] + d[1] * t, FAR]; };
  // 光線 1：平行光軸射向透鏡。凸透鏡：折射後通過焦點 F′；凹透鏡：折射後好像從焦點 F 發出
  if (show('r1')) {
    const c = css('ray1'), A = [0, h, 0];
    out += seg(tip, A, c);
    out += seg(A, extendDir(A, [0 - A[0], 0 - A[1], fs - A[2]]), c);
    if (conc) out += seg(A, [0, 0, -f], c, { dash: '5 6', opacity: 0.75 });   // 反向延長線回到 F
    else if (virtual) out += seg(A, imgTip, c, { dash: '5 6', opacity: 0.75 });
  }
  if (show('r2')) {
    const c = css('ray2'), O = [0, 0, 0];
    out += seg(tip, O, c);
    out += seg(O, extend(tip, O), c);
    if (virtual) out += seg(O, imgTip, c, { dash: '5 6', opacity: 0.75 });
  }
  // 光線 3：折射後平行光軸。凸透鏡：沿「焦點 F 與尖端」的連線射入；凹透鏡：朝另一側焦點 F′ 射入
  if (show('r3') && !r.none) {
    const c = css('ray3');
    const B = [0, h * fs / (fs - p), 0];   // 打到透鏡的高度
    out += seg(tip, B, c);
    out += seg(B, [0, B[1], FAR], c);
    if (!conc && p < f) out += seg([0, 0, -f], tip, c, { dash: '3 6', opacity: 0.6 });
    if (conc) out += seg(B, [0, 0, f], c, { dash: '3 6', opacity: 0.6 });   // 原本瞄準 F′ 的方向
    if (virtual) out += seg(B, imgTip, c, { dash: '5 6', opacity: 0.75 });
  }
  if (show('r4')) {
    const c = css('flag'), O = [0, 0, 0];
    out += seg(ft, O, c, { width: 2.2 });
    out += seg(O, extend(ft, O), c, { width: 2.2 });
    if (virtual) out += seg(O, imgFt, c, { dash: '5 6', opacity: 0.75 });
  }

  // 虛像：和物體同一側，用虛線外框表示
  if (virtual) {
    out += arrowFlag(r.q, h, r.m, css('img'), css('flag'), { hollow: true, dash: '7 5' });
    out += label([0, r.hi, r.q], '虛像', 'svg-label', { dy: -12, color: css('img') });
  }

  dyn.innerHTML = out;
  updateObject();
  objG.setAttribute('aria-valuetext', `物距 ${fmt(p)} 公分，物高 ${fmt(h)} 公分`);
  updateReadout(r);
}

// ===== 數據區 =====
const fmt = (v, d = 1) => (Math.round(v * 10 ** d) / 10 ** d).toFixed(d);
function updateReadout(r) {
  const { f, p, h } = state;
  const near = (a, b) => Math.abs(a - b) < 0.01;
  let region;
  if (isConcave()) region = '凹透鏡：物體放在哪裡，都成正立、縮小的虛像';
  else if (near(p, 2 * f)) region = '物體在 2F 上';
  else if (p > 2 * f) region = '物體在 2F 以外';
  else if (p > f) region = '物體在 F 與 2F 之間';
  else if (near(p, f)) region = '物體在焦點 F 上';
  else region = '物體在焦點 F 以內';
  document.getElementById('region').textContent = region;

  pSlider.value = Math.round(p);
  hSlider.value = Math.round(h);
  document.getElementById('fOut').textContent = isConcave() ? `−${f} 公分` : `${f} 公分`;
  document.getElementById('pSliderOut').textContent = `${fmt(p, 0)} 公分`;
  document.getElementById('hSliderOut').textContent = `${fmt(h, 0)} 公分`;
  document.getElementById('pOut').textContent = `${fmt(p)} 公分`;
  document.getElementById('hOut').textContent = `${fmt(h)} 公分`;

  const verdict = document.getElementById('verdict');
  const note = document.getElementById('note');
  if (r.none) {
    document.getElementById('qOut').textContent = '∞（不成像）';
    document.getElementById('hiOut').textContent = '—';
    document.getElementById('mOut').textContent = '—';
    verdict.innerHTML = '<span class="chip">折射光互相平行，不成像</span>';
    note.textContent = '';
    return;
  }
  document.getElementById('qOut').textContent = `${fmt(r.q)} 公分${r.q < 0 ? '（物體同側）' : ''}`;
  document.getElementById('hiOut').textContent = `${fmt(r.hi)} 公分`;
  document.getElementById('mOut').textContent = fmt(r.m, 2);
  const real = r.q > 0;
  const size = Math.abs(r.m) > 1.005 ? '放大' : Math.abs(r.m) < 0.995 ? '縮小' : '等大';
  const far = real && r.q >= 1200;
  verdict.innerHTML = `
    <span class="chip ${real ? 'real' : 'virtual'}">${real ? '實像' : '虛像'}</span>
    <span class="chip">${real ? '倒立' : '正立'}</span>
    <span class="chip flip">${real ? '左右相反' : '左右不變'}</span>
    <span class="chip">${size}</span>
    ${far ? '<span class="chip">像超出畫面</span>' : ''}`;
  note.textContent = real
    ? '上下顛倒加上左右相反，等於把物體繞著光軸轉 180°，不是鏡子裡的反像。'
    : isConcave()
      ? '凹透鏡的像永遠是正立、縮小的虛像：旗子仍在右手邊，也沒有上下顛倒。'
      : '虛像和物體方向相同：旗子仍在右手邊，也沒有上下顛倒。';
}

// ===== 拖曳物體 =====
function screenPoint(evt) {
  const pt = svg.createSVGPoint();
  pt.x = evt.clientX; pt.y = evt.clientY;
  return pt.matrixTransform(svg.getScreenCTM().inverse());
}
function snap(p) {
  for (const t of [state.f, 2 * state.f]) if (Math.abs(p - t) < 2) return t;
  return p;
}
function setObject(p, h) {
  state.p = snap(Math.min(240, Math.max(5, p)));
  state.h = Math.min(80, Math.max(10, h));
  scheduleRender();
}
let drag = null;
objG.addEventListener('pointerdown', e => {
  const s = screenPoint(e);
  const [y, z] = unprojectX0(s.x, s.y);
  drag = { dy: state.h - y, dz: -state.p - z };   // 記住手指與箭頭的相對位置
  objG.setPointerCapture(e.pointerId);
  objG.focus({ preventScroll: true });
  e.preventDefault();
});
objG.addEventListener('pointermove', e => {
  if (!drag) return;
  const s = screenPoint(e);
  const [y, z] = unprojectX0(s.x, s.y);
  setObject(-(z + drag.dz), y + drag.dy);
});
const endDrag = () => { drag = null; };
objG.addEventListener('pointerup', endDrag);
objG.addEventListener('pointercancel', endDrag);
objG.addEventListener('touchstart', e => e.preventDefault(), { passive: false });
objG.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
objG.addEventListener('keydown', e => {
  const step = e.shiftKey ? 10 : 2;
  const moves = { ArrowLeft: [step, 0], ArrowRight: [-step, 0], ArrowUp: [0, step], ArrowDown: [0, -step] };
  const m = moves[e.key];
  if (!m) return;
  e.preventDefault();
  setObject(state.p + m[0], state.h + m[1]);
});

// ===== 控制項 =====
const fSlider = document.getElementById('fSlider');
const pSlider = document.getElementById('pSlider');
const hSlider = document.getElementById('hSlider');
fSlider.addEventListener('input', () => { state.f = Number(fSlider.value); scheduleRender(); });
pSlider.addEventListener('input', () => setObject(Number(pSlider.value), state.h));
hSlider.addEventListener('input', () => setObject(state.p, Number(hSlider.value)));
['r1', 'r2', 'r3', 'r4'].forEach(id => document.getElementById(id).addEventListener('change', scheduleRender));
document.getElementById('reset').addEventListener('click', () => {
  state = { ...DEFAULT };
  fSlider.value = DEFAULT.f;
  ['r1', 'r2', 'r3', 'r4'].forEach(id => document.getElementById(id).checked = true);
  scheduleRender();
});

// ===== 凸透鏡／凹透鏡切換（網址 #concave 直接打開凹透鏡，和平面版互通）=====
const RAY_TEXT = {
  convex: ['平行光軸 → 折射後通過焦點', '通過焦點 → 折射後平行光軸'],
  concave: ['平行光軸 → 折射後好像從焦點 F 發出', '射向另一側焦點 F′ → 折射後平行光軸'],
};
function setType(type) {
  lensType = type === 'concave' ? 'concave' : 'convex';
  document.getElementById('tConvex').setAttribute('aria-pressed', String(!isConcave()));
  document.getElementById('tConcave').setAttribute('aria-pressed', String(isConcave()));
  document.getElementById('r1Text').textContent = RAY_TEXT[lensType][0];
  document.getElementById('r3Text').textContent = RAY_TEXT[lensType][1];
  const hash = isConcave() ? '#concave' : '';
  document.getElementById('to2d').href = './' + hash;
  try { history.replaceState(null, '', location.pathname + location.search + hash); } catch (e) {}
  scheduleRender();
}
document.getElementById('tConvex').addEventListener('click', () => setType('convex'));
document.getElementById('tConcave').addEventListener('click', () => setType('concave'));
window.addEventListener('hashchange', () => setType(location.hash === '#concave' ? 'concave' : 'convex'));

new ResizeObserver(() => { updateScale(); scheduleRender(); }).observe(svg);
const onTheme = () => { readColors(); scheduleRender(); };
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', onTheme);
new MutationObserver(onTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

setupCamera();
updateScale();
readColors();
setType(location.hash === '#concave' ? 'concave' : 'convex');
render();
</script>

</body>
